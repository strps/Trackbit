name: Android

on:
  push:
    branches: [main, dev, kotlin-app]
    paths:
      - 'apps/android/**'
      - 'apps/frontend/src/i18n/locales/**'
      - 'apps/frontend/src/index.css'
      - 'apps/frontend/src/features/habits-configuration/habit-icons.ts'
      - 'packages/types/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'apps/android/**'
      - 'apps/frontend/src/i18n/locales/**'
      - 'apps/frontend/src/index.css'
      - 'apps/frontend/src/features/habits-configuration/habit-icons.ts'
      - 'packages/types/**'
      - '.github/workflows/android.yml'

jobs:
  # The strings, presets, colors and icons generated from the web app must be committed and current.
  generated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm android:generate:check

  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew assembleDebug testDebugUnitTest lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: reports
          path: apps/android/**/build/reports/
