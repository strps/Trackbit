name: Backend

on:
  push:
    branches: [main, dev, kotlin-app]
    paths: ['apps/backend/**', 'packages/types/**', 'pnpm-lock.yaml', '.github/workflows/backend.yml']
  pull_request:
    paths: ['apps/backend/**', 'packages/types/**', 'pnpm-lock.yaml', '.github/workflows/backend.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: trackbit_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/trackbit_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter backend exec tsc --noEmit -p .
      - run: pnpm --filter backend test
